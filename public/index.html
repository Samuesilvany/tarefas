<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Tarefas</title>
  <!-- Bootstrap pronto para usar -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container" style="max-width: 800px;">
    <h1 class="mb-4 text-center">Minhas Tarefas</h1>

    <!-- 1. FORMULÁRIO DE CADASTRO -->
    <div class="card p-3 mb-4 shadow-sm">
      <h5 class="card-title mb-3">Nova Tarefa</h5>
      <form id="form-tarefa">
        <div class="mb-3">
          <label class="form-label">Nome da Tarefa</label>
          <input type="text" id="nome" class="form-control" placeholder="Ex: Estudar Bootstrap" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Descrição</label>
          <textarea id="descricao" class="form-control" rows="2" placeholder="Opcional..."></textarea>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Data</label>
            <input type="date" id="data" class="form-control">
          </div>
          <div class="col-md-6 mb-3 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="lembrete">
              <label class="form-check-label" for="lembrete">Receber lembrete?</label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Salvar Tarefa</button>
      </form>
    </div>

    <!-- 2. LISTA DE TAREFAS -->
    <div class="card p-3 shadow-sm">
      <h5 class="card-title mb-3">Lista de Tarefas</h5>
      
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Tarefa</th>
            <th>Data</th>
            <th>Lembrete</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <!-- Exemplo de linha -->
          <tr>
            <td>
              <strong>Criar banco de dados</strong><br>
              <small class="text-muted">Exportar arquivo SQL/CSV</small>
            </td>
            <td>10/10/2026</td>
            <td>Sim</td>
            <td>
              <button class="btn btn-sm btn-success">Concluir</button>
              <button class="btn btn-sm btn-danger">Excluir</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
